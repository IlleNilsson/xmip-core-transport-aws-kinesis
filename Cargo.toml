# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-transport-aws-kinesis"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-transport-aws-kinesis"
description = "Amazon Kinesis Data Streams transport: Signature Version 4 over the JSON API — put a Stream as one record, read a shard on from where it last stopped — a stream and its shard are a Location. A xmip-core-transport technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md).
transport = { package = "xmip-core-transport", git = "https://github.com/IlleNilsson/xmip-core-transport", branch = "main" }
# The endpoint parser, the request and its answer, and TLS behind the
# `tls` feature — one TLS stack in the estate, the http technology's
# (ADR-0033).
http = { package = "xmip-core-transport-http", git = "https://github.com/IlleNilsson/xmip-core-transport-http", branch = "main" }
# HTTP/1.1 on the wire (`net::http`) and the URL an endpoint is
# (`net::Endpoint`): the one codec every technology riding on HTTP calls.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }
# Signature Version 4 and the JSON 1.1 protocol. The signer came from the
# aws-sqs technology until 2026-09-14 and JSON 1.1 was this crate's own;
# what AWS speaks is the AWS crate's (ADR-0044, the owner's ruling of
# 2026-09-22).
aws = { package = "xmip-core-transport-aws", git = "https://github.com/IlleNilsson/xmip-core-transport-aws", branch = "main" }
# The API answers in JSON, and serde reads it.
serde_json = "1"
# Bytes travel in JSON as base64, the estate's one: codec's.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }

[features]
default = []
# HTTPS endpoints. Off by default, as it is in the http technology.
tls = ["http/tls"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
