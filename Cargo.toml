[package]
name = "xmip-core-transport-aws-kinesis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-aws-kinesis"
description = "Amazon Kinesis Data Streams transport: Signature Version 4 over the JSON API — put a Stream as one record, read a shard on from where it last stopped — a stream and its shard are a Location. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { workspace = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The endpoint parser, the request and its answer, and TLS behind the
# `tls` feature — one TLS stack in the estate, the http technology's
# (ADR-0033).
http = { workspace = true, optional = true }
# HTTP/1.1 on the wire (`net::http`) and the URL an endpoint is
# (`net::Endpoint`): the one codec every technology riding on HTTP calls.
net = { workspace = true, optional = true }
# Signature Version 4 and the JSON 1.1 protocol. The signer came from the
# aws-sqs technology until 2026-09-14 and JSON 1.1 was this crate's own;
# what AWS speaks is the AWS crate's (ADR-0044, the owner's ruling of
# 2026-09-22). Its declaration alone where this crate is
# (`access_key::ACCESS_KEY_ID`).
aws = { workspace = true, default-features = false }
# The API answers in JSON, and serde reads it.
serde_json = { version = "1", optional = true }
# Bytes travel in JSON as base64, the estate's one: codec's.
codec = { workspace = true, optional = true }

[dev-dependencies]
# A Location's secret held in memory for the tests, from the capability's
# test support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "aws/default", "dep:http", "dep:net", "dep:serde_json", "dep:codec"]
# The declaration alone, the AWS crate's `access_key_id` among its settings.
declaration = ["aws/declaration"]
# HTTPS endpoints: the http technology's `tls`, off by default as there.
tls = ["default", "http/tls"]

[lints]
workspace = true
